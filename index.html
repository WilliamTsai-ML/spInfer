<title>Lantern English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column, a quiet top bar, the live learner model pinned at the bottom. */
:root {
  --bg: #f7f4ec;        /* warm paper */
  --surface: #fffdf7;
  --fg: #1f2a2e;        /* ink */
  --muted: #6b7478;
  --line: #ddd6c6;
  --accent: #c2541a;    /* lantern orange */
  --accent-ink: #fff6ee;
  --good: #2f7d4f;
  --bad: #b3261e;
  --warn: #9a6b00;
  --display: 'Literata', 'Songti TC', 'PingFang TC', Georgia, serif;
  --body: 'Public Sans', -apple-system, 'PingFang TC', 'Noto Sans TC', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15191b; --surface: #1d2326; --fg: #ece6d8; --muted: #9aa3a6; --line: #313a3e;
  --accent: #e8743a; --accent-ink: #1a0f08; --good: #6cc38d; --bad: #f08a83; --warn: #e2b74a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15191b; --surface: #1d2326; --fg: #ece6d8; --muted: #9aa3a6; --line: #313a3e;
  --accent: #e8743a; --accent-ink: #1a0f08; --good: #6cc38d; --bad: #f08a83; --warn: #e2b74a; color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 17px; line-height: 1.45; }
#app { min-height: 100%; display: flex; flex-direction: column; max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 8px; }
.top { display: flex; align-items: center; justify-content: space-between; padding-block: 12px 4px; }
.brand { font-family: var(--display); font-weight: 600; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
.lamp { width: 12px; height: 16px; border-radius: 6px 6px 7px 7px; background: var(--accent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--accent); display: inline-block; }
.screen { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-block: 10px 18px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15; }
h1 { font-size: 2.2rem; } h2 { font-size: 1.45rem; } h3 { font-size: 1.1rem; margin-top: 6px; }
p { margin: 0; max-width: 34em; }
.lede { font-size: 1.15rem; }
.muted { color: var(--muted); } .small { font-size: 0.85rem; }
.hero { display: flex; flex-direction: column; gap: 14px; padding-block: 40px 0; }
.hero .row { margin-top: 10px; } .hero .row + button { align-self: stretch; }

button { font: inherit; font-weight: 600; border-radius: 10px; padding: 13px 18px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; min-height: 48px; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.45; cursor: default; }
.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.secondary { background: var(--surface); }
.ghost { background: transparent; border-color: transparent; padding: 8px 10px; min-height: 36px; color: var(--accent); }
.mic.live { background: var(--bad); border-color: var(--bad); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--bad) 25%, transparent); } }
@media (prefers-reduced-motion: reduce) { .mic.live { animation: none; } .word.pop { animation: none; } }
.row { display: flex; gap: 10px; } .row > button { flex: 1; } .row.left { justify-content: flex-start; } .row.left > button { flex: 0 0 auto; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.card.big { min-height: 150px; display: grid; place-items: center; }
.word { font-family: var(--display); font-size: 2.4rem; font-weight: 500; letter-spacing: 0.01em; word-break: break-word; text-align: center; }
.word.pop { animation: pop 180ms ease-out; }
.word.ok { color: var(--good); } .word.bad { color: var(--bad); }
.verdict { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 2.6em; text-align: center; }
.verdict .good { color: var(--good); font-weight: 600; } .verdict .bad { color: var(--bad); font-weight: 600; }
.card.big { gap: 8px; }
@keyframes pop { from { opacity: 0; transform: translateY(6px); } }
.progress { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 200ms; }
.sentence { font-family: var(--display); font-size: 1.5rem; line-height: 1.4; }
.w.ok { color: var(--good); } .w.wrong { color: var(--bad); text-decoration: underline wavy; } .w.missing { color: var(--muted); text-decoration: line-through; }
.heard { font-size: 0.95rem; color: var(--muted); min-height: 1.4em; }
.trace { font-size: 0.7rem; opacity: 0.7; word-break: break-word; }
textarea { font: inherit; width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); color: var(--fg); resize: vertical; }
textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }

.skills { display: flex; flex-direction: column; gap: 14px; }
.skill { display: flex; flex-direction: column; gap: 6px; }
.skill-head { display: flex; justify-content: space-between; align-items: baseline; }
.level { font-family: var(--display); font-size: 1.3rem; color: var(--accent); }
.scale { position: relative; display: grid; grid-template-columns: repeat(6, 1fr); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.scale span { text-align: center; padding: 4px 0; border-left: 1px solid var(--line); } .scale span:first-child { border-left: 0; }
.scale i { position: absolute; top: -4px; bottom: -4px; width: 4px; margin-left: -2px; background: var(--accent); border-radius: 2px; }
.note { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 40%, var(--line)); border-radius: 10px; padding: 10px 12px; font-size: 0.95rem; }
.sounds { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }

.model { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; border-top: 1px solid var(--line); padding-block: 8px; font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.model .cell { display: flex; justify-content: space-between; gap: 8px; min-width: 0; }
.model .v { white-space: nowrap; }
</style>
<div id="app"></div>
<script type="module">
import { App } from './js/ui/App.js';
import { createPlatform } from './js/services/Platform.js';
const app = new App({ platform: createPlatform(), root: document.getElementById('app') });
window.lantern = app; // for tests and poking from the console
app.boot();
</script>
